<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Bumblebee AR</title>
    
    <!-- Librería oficial de Google cargada de forma segura mediante HTTPS -->
    <script type="module" src="https://googleapis.com"></script>
    
    <style>
        /* Optimización total de pantalla para dispositivos móviles */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            height: -webkit-fill-available; /* Corrección de altura para Safari móvil */
            overflow: hidden;
            background-color: #645e3b; 
            font-family: sans-serif;
            position: relative;
        }

        /* Capa exclusiva para la imagen de fondo con opacidad media */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('descarga (3).jpeg'); 
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.5; 
            z-index: 0; 
         }
        
        /* Visor 3D adaptado para abarcar todo el espacio táctil del móvil */
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
            --poster-color: transparent;
            position: relative;
            z-index: 1; 
        }

        /* Botón de AR flotante optimizado para pulsaciones táctiles (Mobile Friendly) */
        #ar-button {
            background-color: #ffffff;
            border-radius: 50px; /* Bordes más redondeados para diseño móvil */
            border: none;
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%); /* Centrado perfectamente en pantallas móviles */
            padding: 16px 32px;
            font-size: 16px;
            color: #645e3b; 
            box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            z-index: 4; 
            user-select: none;
            -webkit-user-select: none;
            font-weight: bold;
            white-space: nowrap;
            letter-spacing: 0.5px;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        /* Efecto feedback visual rápido al mantener presionado en celular */
        #ar-button:active {
            transform: translateX(-50%) scale(0.95);
            background-color: #f0f0f0;
        }

        /* Estilo para las partículas de ruedas animadas */
        .wheel-particle {
            position: fixed;
            pointer-events: none;
            font-size: 28px;
            z-index: 9999;
            animation: flyParticle 0.8s ease-out forwards;
        }

        @keyframes flyParticle {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translate(var(--x), var(--y)) scale(0.3) rotate(var(--r));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- El componente gestiona por sí mismo la activación HTTPS de WebXR -->
    <model-viewer 
        id="bumblebee-viewer"
        src="./modelado.glb" 
        ios-src="./modeladoau.usdz"
        ar 
        ar-modes="scene-viewer quick-look webxr" 
        ar-placement="floor"
        camera-controls 
        touch-action="none" <!-- Optimiza el arrastre del modelo 3D en pantallas táctiles sin interferir con el scroll -->
        shadow-intensity="1" 
        alt="Un modelo 3D interactivo en Realidad Aumentada">
        
        <!-- Botón oficial enlazado mediante slot -->
        <button slot="ar-button" id="ar-button">
            Apreta para ver a Bumblebee (AR)
        </button>
        
    </model-viewer>

    <script>
        const arButton = document.getElementById('ar-button');

        // Manejador del evento táctil móvil (touchstart/click)
        arButton.addEventListener('click', function(e) {
            // El salto a la Realidad Aumentada se delega de forma nativa a la librería HTTPS.
            // Esto previene bloqueos de seguridad por "falso click" en navegadores móviles rígidos.

            // Efecto visual de explosión de ruedas (🛞) adaptado para móviles
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);

            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'wheel-particle';
                particle.innerText = '🛞';
                
                particle.style.left = (clientX || window.innerWidth / 2) + 'px';
                particle.style.top = (clientY || window.innerHeight - 60) + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 140 + 50; 
                const x = Math.cos(angle) * velocity + 'px';
                const y = Math.sin(angle) * velocity + 'px';
                const rotation = (Math.random() * 360) + 'deg';
                
                particle.style.setProperty('--x', x);
                particle.style.setProperty('--y', y);
                particle.style.setProperty('--r', rotation);
                
                document.body.appendChild(particle);
                
                setTimeout(() => {
                    particle.remove();
                }, 800);
            }
        });
    </script>

</body>
</html>
