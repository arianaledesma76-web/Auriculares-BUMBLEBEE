<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenidos💛</title>
    
    <!-- Importa el componente model-viewer de Google -->
    <script type="module" src="https://googleapis.com"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #FFF9E6; /* Mantiene el fondo amarillo pastel de base */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Capa exclusiva para la imagen de fondo con opacidad media */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('descarga (3).jpeg'); /* Reemplaza por la ruta de tu imagen */
            background-repeat: no-repeat;
            background-position: center;
            background-size: contain;
            opacity: 0.5; /* Opacidad media (50%) */
            z-index: 0;
        }
        
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: transparent;
            --poster-color: transparent;
            position: relative;
            z-index: 1;
        }

        /* Estilo personalizado para el botón de Realidad Aumentada */
        #ar-button {
            background-color: #ffffff;
            border-radius: 4px;
            border: none;
            position: absolute;
            bottom: 32px;
            right: 32px;
            padding: 12px 24px;
            font-size: 16px;
            color: #4285f4;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            z-index: 2;
            user-select: none;
        }

        /* Estilo para las partículas de ruedas animadas */
        .wheel-particle {
            position: fixed;
            pointer-events: none;
            font-size: 24px;
            z-index: 9999;
            animation: flyParticle 1s ease-out forwards;
        }

        @keyframes flyParticle {
            0% {
                transform: translate(0, 0) scale(1) rotate(0deg);
                opacity: 1;
            }
            100% {
                /* Se dispersan usando las variables dinámicas de JS */
                transform: translate(var(--x), var(--y)) scale(0.5) rotate(var(--r));
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- El visor 3D interactivo para Android e iPhone -->
    <model-viewer 
        src="modelo.glb" 
        ios-src="modelo.usdz"
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        touch-action="pan-y" 
        shadow-intensity="1" 
        alt="Un modelo 3D interactivo en Realidad Aumentada">
        
        <!-- Botón que se muestra solo en dispositivos compatibles con AR -->
        <button slot="ar-button" id="ar-button">
            Apreta para ver a Bumblebee (AR)
        </button>
        
    </model-viewer>

    <!-- Script para crear el efecto de explosión de ruedas -->
    <script>
        document.getElementById('ar-button').addEventListener('click', function(e) {
            // Crea 10 ruedas flotantes por cada clic
            for (let i = 0; i < 10; i++) {
                const particle = document.createElement('div');
                particle.className = 'wheel-particle';
                particle.innerText = '🛞';
                
                // Posiciona la partícula justo donde está el botón/dedo del usuario
                particle.style.left = e.clientX + 'px';
                particle.style.top = e.clientY + 'px';
                
                // Calcula direcciones y rotaciones aleatorias para la dispersión
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 120 + 40; // Distancia que viajarán
                const x = Math.cos(angle) * velocity + 'px';
                const y = Math.sin(angle) * velocity + 'px';
                const rotation = (Math.random() * 360) + 'deg';
                
                // Asigna los valores al CSS de la partícula
                particle.style.setProperty('--x', x);
                particle.style.setProperty('--y', y);
                particle.style.setProperty('--r', rotation);
                
                document.body.appendChild(particle);
                
                // Elimina el elemento del HTML tras terminar la animación
                setTimeout(() => {
                    particle.remove();
                }, 1000);
            }
        });
    </script>

</body>
</html>
